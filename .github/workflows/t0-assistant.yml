name: T0 Assistant

on:
  pull_request:
    paths:
      - ".github/workflows/t0-assistant.yml"
      - "apps/t0-assistant/**"
      - "packages/marketdata/**"
      - "packages/t0assistant/**"
      - "packages/chantheory/**"
      - "packages/indicators/**"
      - "packages/__init__.py"
      - "packages/_import_aliases.py"
      - "marketdata/**"
      - "chantheory/**"
      - "spikes/0008-czsc-update-and-rebuild-strategy/**"
      - "spikes/0009-czsc-1.0.1-upgrade/baseline/**"
      - "docs/t0assistant/**"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/t0-assistant.yml"
      - "apps/t0-assistant/**"
      - "packages/marketdata/**"
      - "packages/t0assistant/**"
      - "packages/chantheory/**"
      - "packages/indicators/**"
      - "packages/__init__.py"
      - "packages/_import_aliases.py"
      - "marketdata/**"
      - "chantheory/**"
      - "spikes/0008-czsc-update-and-rebuild-strategy/**"
      - "spikes/0009-czsc-1.0.1-upgrade/baseline/**"
      - "docs/t0assistant/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  python-smoke:
    name: Python smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Run marketdata tests
        run: python apps/t0-assistant/tests/run_required_python.py packages/marketdata/tests
      - name: Run T+0 core tests
        run: python apps/t0-assistant/tests/run_required_python.py packages/t0assistant/tests
      - name: Run Chan Theory tests
        run: python apps/t0-assistant/tests/run_required_python.py packages/chantheory/tests
      - name: Run indicator tests
        run: python apps/t0-assistant/tests/run_required_python.py packages/indicators/tests
      - name: Run CI gate regression tests
        run: python apps/t0-assistant/tests/run_required_python.py apps/t0-assistant/tests test_ci_gates.py
      - name: Run backend lifecycle smoke
        run: python apps/t0-assistant/tests/run_required_python.py apps/t0-assistant/tests test_service.py

  renderer-smoke:
    name: Renderer smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/t0-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/t0-assistant/package-lock.json
      - run: npm ci
      - name: Run chart regression tests
        run: >
          node tests/run-required-tests.mjs node
          tests/ci-gates.test.mjs
          tests/chart-model.test.mjs
          tests/chart-primitives-lc.test.mjs
          tests/chart-snapshot-smoke.test.mjs
      - name: Run App session viewport integration tests
        run: npm run test:app
      - run: npm run smoke:renderer

  electron-smoke:
    name: Electron smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/t0-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/t0-assistant/package-lock.json
      - name: Install project
        run: python -m pip install -e .
        working-directory: .
      - run: npm ci
      - run: npm run smoke:electron
        env:
          T0_PYTHON: python

  contract-smoke:
    name: Contract smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/t0-assistant/package-lock.json
      - run: npm ci
        working-directory: apps/t0-assistant
      - name: Install contract validator
        run: python -m pip install 'jsonschema>=4.23'
      - name: Run Python contract tests
        run: python apps/t0-assistant/tests/run_required_python.py apps/t0-assistant/tests test_contracts.py
      - name: Run Node contract tests
        run: npm run test:contracts
        working-directory: apps/t0-assistant
